<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#160d09" />
  <meta name="description" content="Sorteo de una botella de Licorca." />
  <title>Botella de Licorca</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Inicio">LICORCA</a>
      <button id="openQrButton" class="qr-trigger" type="button" aria-label="Mostrar código QR">QR</button>
    </header>

    <section class="hero">
      <div class="hero__copy">
        <span id="statusPill" class="status-pill">Cargando</span>
        <p class="eyebrow">SORTEO</p>
        <h1 id="raffleTitle">Una botella<br>de <em>Licorca</em></h1>
        <p id="heroMessage" class="hero__lead"></p>
        <div class="draw-meta" aria-live="polite">
          <div><span class="draw-meta__label">Sorteo</span><strong id="countdown">--:--:--</strong></div>
          <p id="drawDate">—</p>
        </div>
      </div>

      <div class="bottle-stage" aria-label="Una botella de Licorca">
        <div class="halo"></div>
        <div class="bottle" aria-hidden="true">
          <span class="bottle__cap"></span><span class="bottle__neck"></span>
          <span class="bottle__body"><span class="bottle__shine"></span><span class="bottle__label">LICORCA<small>LICOR DE CAFÉ</small></span></span>
        </div>
      </div>
    </section>

    <section class="entry-card">
      <form id="entryForm" class="entry-form" novalidate>
        <label class="sr-only" for="nameInput">Nombre</label>
        <input id="nameInput" name="name" type="text" minlength="2" maxlength="60" autocomplete="name" placeholder="Tu nombre" required />
        <button id="submitButton" class="button" type="submit">Participar</button>
        <p id="formMessage" class="form-message" role="status"></p>
      </form>
      <div id="registeredTicket" class="ticket ticket--hidden" aria-live="polite"><span class="ticket__check">✓</span><strong id="registeredName">—</strong><span>Dentro</span></div>
      <div class="entry-card__count" aria-label="Participantes"><span id="participantsCount">—</span><span aria-hidden="true"> · </span><span>personas</span></div>
      <span id="registrationStatus" class="sr-only">—</span><span id="drawTime" class="sr-only">—</span>
    </section>

    <section id="winnerSection" class="winner-panel winner-panel--hidden" aria-live="assertive"><p>Ganador/a</p><h2 id="winnerName">—</h2></section>
    <footer class="footer"><span id="lastUpdate">—</span></footer>
  </main>

  <dialog id="qrDialog" class="qr-dialog">
    <form method="dialog" class="qr-dialog__inner"><button class="qr-dialog__close" aria-label="Cerrar">×</button><p>Escanea</p><div id="qrCode" class="qr-code"></div><p id="qrUrl" class="qr-url"></p></form>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
